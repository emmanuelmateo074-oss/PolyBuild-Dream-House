<body><div id="app"><div id="scene"></div>
<header class="topbar"><div class="brand">⌂ BUILDCRAFT 3D<small>DREAM HOUSE STUDIO</small></div><div class="top-actions"><button id="save-top">↧ Save</button><button id="load-top">↥ Load</button></div></header>
<aside class="panel left"><div class="eyebrow">Your workshop</div><div class="title">Build something.</div><div class="copy">Choose a shape and finish. Drag to orbit, pinch to zoom, tap to place.</div><div class="section"><div class="section-title">Architecture <small>SHAPE</small></div><div class="tools"><button class="tool active" data-piece="block"><b>▰</b>Block</button><button class="tool" data-piece="wall"><b>▤</b>Thin wall</button><button class="tool" data-piece="roof"><b>⌂</b>Sloped roof</button><button class="tool" data-piece="window"><b>▧</b>Window</button><button class="tool" data-piece="door"><b>▯</b>Door</button></div></div><div class="section"><div class="section-title">Materials <small>FINISH</small></div><div class="materials"><button class="material active" data-material="wood"><i class="swatch wood"></i><span>Wood<small>Oak grain</small></span></button><button class="material" data-material="brick"><i class="swatch brick"></i><span>Brick<small>Hand laid</small></span></button><button class="material" data-material="glass"><i class="swatch glass"></i><span>Glass<small>Translucent</small></span></button><button class="material" data-material="concrete"><i class="swatch concrete"></i><span>Concrete<small>Cast finish</small></span></button></div></div><div class="section rotate"><span>Block rotation</span><span><button id="rotate">↻ Rotate</button> <b id="rotation">0°</b></span></div></aside>

<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const KEY='polybuild-dream-house',host=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#a9c5b7');scene.fog=new THREE.Fog('#a9c5b7',40,105);const camera=new THREE.PerspectiveCamera(42,1,.1,180);camera.position.set(12,11,15);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.dampingFactor=.075;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=5;controls.maxDistance=42;controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
const sky=new THREE.Mesh(new THREE.SphereGeometry(150,32,20),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,vertexShader:'varying vec3 vWorld;void main(){vec4 w=modelMatrix*vec4(position,1.);vWorld=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',fragmentShader:'varying vec3 vWorld;void main(){float h=normalize(vWorld).y;gl_FragColor=vec4(mix(vec3(.70,.81,.79),vec3(.22,.43,.52),smoothstep(-.08,.85,h)),1.);}'}));scene.add(sky);scene.add(new THREE.HemisphereLight('#e7f5ff','#596248',1.45));const sun=new THREE.DirectionalLight('#fff0d6',3.1);sun.position.set(-12,22,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-24;sun.shadow.camera.far=65;sun.shadow.bias=-.00025;sun.shadow.normalBias=.025;sun.shadow.radius=4;scene.add(sun);
function groundTexture(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#748b66';x.fillRect(0,0,256,256);for(let i=0;i<6500;i++){const px=Math.random()*256,py=Math.random()*256;x.strokeStyle=['#526b4c','#82986d','#98a77a','#657e55'][i%4];x.globalAlpha=.4;x.lineWidth=.8;x.beginPath();x.moveTo(px,py);x.lineTo(px+(Math.random()-.5)*2,py-2-Math.random()*5);x.stroke()}x.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(28,28);return t}const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({map:groundTexture(),color:'#c5d0ae',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.055;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(40,40,'#e1eadb44','#e1eadb2b');grid.position.y=-.04;scene.add(grid);
function tex(type){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');if(type==='wood'){x.fillStyle='#a87548';x.fillRect(0,0,256,256);for(let i=0;i<36;i++){const y=Math.random()*256;x.strokeStyle=i%3?'#43251128':'#eec18944';x.lineWidth=Math.random()*3+1;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(80,y-8,160,y+9,256,y);x.stroke()}}else if(type==='brick'){x.fillStyle='#a9543f';x.fillRect(0,0,256,256);for(let r=0;r<8;r++){const y=r*32;x.fillStyle='#39272088';x.fillRect(0,y,256,3);for(let col=-1;col<5;col++){const xx=col*64+(r%2?32:0);x.fillRect(xx,y,3,32);x.fillStyle=['#b96349','#974b3a','#bc684e'][Math.floor(Math.random()*3)];x.fillRect(xx+4,y+4,56,24)}}}else{x.fillStyle=type==='glass'?'#85c8c0':'#929792';x.fillRect(0,0,256,256);if(type==='glass'){const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,'#effff899');g.addColorStop(.5,'#82cdca22');g.addColorStop(1,'#377f893d');x.fillStyle=g;x.fillRect(0,0,256,256)}else for(let i=0;i<1600;i++){const n=100+Math.random()*90;x.fillStyle=`rgba(${n},${n},${n},.22)`;x.fillRect(Math.random()*256,Math.random()*256,2,2)}}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}const maps={wood:tex('wood'),brick:tex('brick'),glass:tex('glass'),concrete:tex('concrete')},cfg={wood:['#a87548',.72,1],brick:['#a9543f',.9,1],glass:['#91d6ce',.16,.48],concrete:['#a1a49d',.94,1]};function mat(type,ghost=false){const s=cfg[type]||cfg.wood;return new THREE.MeshStandardMaterial({color:s[0],map:maps[type],roughness:s[1],metalness:type==='glass'?.06:0,transparent:ghost||type==='glass',opacity:ghost?.42:s[2],depthWrite:!ghost&&type!=='glass',side:THREE.DoubleSide})}
function roofGeo(){const s=new THREE.Shape();s.moveTo(-1,-.5);s.lineTo(1,-.5);s.lineTo(1,.5);s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:1,bevelEnabled:false});g.translate(0,.5,-.5);return g}function shape(type,material,ghost=false){const group=new THREE.Group(),solid=mat(material,ghost),frame=mat('concrete',ghost),glass=mat('glass',ghost);if(type==='window'){const top=new THREE.Mesh(new THREE.BoxGeometry(1,.12,.12),frame),bottom=top.clone(),left=new THREE.Mesh(new THREE.BoxGeometry(.12,.76,.12),frame),right=left.clone(),pane=new THREE.Mesh(new THREE.BoxGeometry(.76,.72,.045),glass);top.position.y=.44;bottom.position.y=-.44;left.position.x=-.44;right.position.x=.44;group.add(top,bottom,left,right,pane)}else if(type==='door'){const trim=new THREE.Mesh(new THREE.BoxGeometry(.84,1.08,.1),frame),slab=new THREE.Mesh(new THREE.BoxGeometry(.72,.96,.12),solid),knob=new THREE.Mesh(new THREE.SphereGeometry(.035,10,8),new THREE.MeshStandardMaterial({color:'#d9ba70',metalness:.65}));slab.position.y=-.02;trim.position.z=-.035;knob.position.set(.25,-.02,.08);group.add(trim,slab,knob)}else group.add(new THREE.Mesh(type==='roof'?roofGeo():type==='wall'?new THREE.BoxGeometry(2,1,.16):new THREE.BoxGeometry(1,1,1),solid));group.traverse(o=>{if(o.isMesh){o.castShadow=!ghost;o.receiveShadow=true}});group.userData={type,material};return group}
let piece='block',material='wood',rotation=0,level=0,mode='place',ghost;const pieces=[],ray=new THREE.Raycaster(),center=new THREE.Vector2(0,0),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),point=new THREE.Vector3();function orient(o,t,r){o.rotation.set(0,r,0);if(t==='roof')o.rotation.z=r%2===0?.52:-.52}function makeGhost(){if(ghost)scene.remove(ghost);ghost=shape(piece,material,true);scene.add(ghost);aim()}function aim(){ray.setFromCamera(center,camera);if(ray.ray.intersectPlane(plane,point)){const x=Math.round(point.x-.5)+.5,z=Math.round(point.z-.5)+.5;ghost.position.set(x,level+.5,z);orient(ghost,piece,rotation);ghost.visible=mode==='place'&&Math.abs(x)<18&&Math.abs(z)<18}else ghost.visible=false}function addPiece(d){const t=['block','wall','roof','window','door'].includes(d.type)?d.type:'block',m=['wood','brick','glass','concrete'].includes(d.material)?d.material:'wood',o=shape(t,m);o.userData={...o.userData,type:t,material:m,x:Number(d.x)||0,y:Number(d.y)||.5,z:Number(d.z)||0,rotation:Number(d.rotation)||0,level:Number(d.level)||0};o.position.set(o.userData.x,o.userData.y,o.userData.z);orient(o,t,o.userData.rotation);scene.add(o);pieces.push(o);return o}function updateCount(){document.querySelector('#count').textContent=pieces.length}function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1800)}let audio;function sound(del=false){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio??=new A();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=del?'triangle':'sine';o.frequency.setValueAtTime(del?300:520,t);o.frequency.exponentialRampToValueAtTime(del?170:760,t+.085);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.13)}catch{}}
makeGhost();function tap(){aim();if(mode==='remove'){const hit=ray.intersectObjects(pieces,true)[0];if(!hit){toast('Aim at a piece and tap to delete');return}let root=hit.object;while(root.parent&&root.parent!==scene)root=root.parent;const i=pieces.indexOf(root);if(i<0)return;scene.remove(root);pieces.splice(i,1);updateCount();sound(true);toast('Piece deleted');return}if(!ghost.visible){toast('Aim at the build grid');return}addPiece({type:piece,material,x:ghost.position.x,y:level+.5,z:ghost.position.z,rotation,level});updateCount();sound();toast('Piece placed')}
const active=new Map();let pinch=false;renderer.domElement.addEventListener('pointerdown',e=>{active.set(e.pointerId,{x:e.clientX,y:e.clientY,moved:false});if(active.size>1)pinch=true},{passive:true});renderer.domElement.addEventListener('pointermove',e=>{const p=active.get(e.pointerId);if(p&&Math.hypot(e.clientX-p.x,e.clientY-p.y)>9)p.moved=true},{passive:true});renderer.domElement.addEventListener('pointerup',e=>{const p=active.get(e.pointerId);if(p&&active.size===1&&!pinch&&!p.moved)tap();active.delete(e.pointerId);if(!active.size)pinch=false},{passive:true});const cancel=e=>{active.delete(e.pointerId);if(!active.size)pinch=false};renderer.domElement.addEventListener('pointercancel',cancel,{passive:true});renderer.domElement.addEventListener('lostpointercapture',cancel,{passive:true});function setMode(m){mode=m;document.querySelector('#place').classList.toggle('mode-active',m==='place');document.querySelector('#place').classList.toggle('primary',m==='place');document.querySelector('#remove').classList.toggle('mode-active',m==='remove');document.querySelector('#remove').classList.toggle('primary',m==='remove');aim()}document.querySelector('#place').onclick=()=>setMode('place');document.querySelector('#remove').onclick=()=>setMode('remove');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{piece=b.dataset.piece;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b));makeGhost()});document.querySelectorAll('.material').forEach(b=>b.onclick=()=>{material=b.dataset.material;document.querySelectorAll('.material').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#selected').textContent=material[0].toUpperCase()+material.slice(1);makeGhost()});document.querySelector('#rotate').onclick=()=>{rotation=(rotation+1)%4;document.querySelector('#rotation').textContent=`${rotation*90}°`;aim()};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')document.querySelector('#rotate').click();if(e.key.toLowerCase()==='x')setMode('remove');if(e.key==='Escape')setMode('place')});document.querySelector('#level-up').onclick=()=>{level=Math.min(12,level+1);aim()};document.querySelector('#level-down').onclick=()=>{level=Math.max(0,level-1);aim()};let gridOn=true;document.querySelector('#grid-toggle').onclick=e=>{gridOn=!gridOn;grid.visible=gridOn;e.currentTarget.textContent=gridOn?'▦ Grid on':'▦ Grid off'};document.querySelector('#home').onclick=()=>{camera.position.set(12,11,15);controls.target.set(0,1,0);controls.update()};
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:3,savedAt:new Date().toISOString(),pieces:pieces.map(p=>({x:p.position.x,y:p.position.y,z:p.position.z,type:p.userData.type,material:p.userData.material,rotation:p.userData.rotation,level:p.userData.level}))}));toast(`Saved ${pieces.length} pieces`)}catch{toast('Save failed: storage unavailable')}}function load(){try{const raw=localStorage.getItem(KEY);if(!raw){toast('No saved house found');return}const data=JSON.parse(raw);if(!Array.isArray(data.pieces)||data.pieces.length>10000||!data.pieces.every(p=>p&&Number.isFinite(+p.x)&&Number.isFinite(+p.y)&&Number.isFinite(+p.z)))throw Error('invalid');const valid=data.pieces.map(p=>({...p,type:['block','wall','roof','window','door'].includes(p.type)?p.type:'block',material:['wood','brick','glass','concrete'].includes(p.material)?p.material:'wood'}));pieces.forEach(p=>scene.remove(p));pieces.length=0;valid.forEach(addPiece);updateCount();toast(`Loaded ${pieces.length} pieces`)}catch{toast('Could not load saved house')}}document.querySelectorAll('#save,#save-top').forEach(b=>b.onclick=save);document.querySelectorAll('#load,#load-top').forEach(b=>b.onclick=load);document.querySelector('#clear').onclick=()=>{pieces.forEach(p=>scene.remove(p));pieces.length=0;updateCount();toast('Build cleared')};
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);aim()}window.addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();aim();renderer.render(scene,camera)}animate();
