function roofGeometry(){const s=new THREE.Shape();s.moveTo(-1,-.5);s.lineTo(1,-.5);s.lineTo(1,.5);s.closePath();const geo=new THREE.ExtrudeGeometry(s,{depth:1,bevelEnabled:false});geo.translate(0,.5,-.5);return geo}function makePieceGroup(type,material,preview=false){const g=new THREE.Group(),solid=buildMaterial(material,preview),frame=buildMaterial('concrete',preview),glass=buildMaterial('glass',preview);if(type==='window'){for(const [geo,x,y] of [[new THREE.BoxGeometry(1,.12,.12),0,.44],[new THREE.BoxGeometry(1,.12,.12),0,-.44],[new THREE.BoxGeometry(.12,.76,.12),-.44,0],[new THREE.BoxGeometry(.12,.76,.12),.44,0]]){const m=new THREE.Mesh(geo,frame);m.position.set(x,y,0);g.add(m)}g.add(new THREE.Mesh(new THREE.BoxGeometry(.76,.72,.045),glass))}else if(type==='door'){const trim=new THREE.Mesh(new THREE.BoxGeometry(.84,1.08,.1),frame),slab=new THREE.Mesh(new THREE.BoxGeometry(.72,.96,.12),solid);slab.position.y=-.02;trim.position.z=-.035;g.add(trim,slab)}else{const geo=type==='wall'?new THREE.BoxGeometry(2,1,.16):type==='roof'?roofGeometry():new THREE.BoxGeometry(1,1,1);g.add(new THREE.Mesh(geo,solid))}g.userData={type,material};g.traverse(o=>{if(o.isMesh){o.castShadow=!preview;o.receiveShadow=true}});return g}
let selectedPiece='block',selectedMaterial='wood',rotation=0,level=0,mode='place',gridVisible=true,ghost;const pieces=[],raycaster=new THREE.Raycaster(),center=new THREE.Vector2(0,0),groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hitPoint=new THREE.Vector3();function orient(obj,type,r){obj.rotation.set(0,r,0);if(type==='roof')obj.rotation.z=r%2===0?.52:-.52}function updateAim(){if(!ghost)return;raycaster.setFromCamera(center,camera);if(raycaster.ray.intersectPlane(groundPlane,hitPoint)){const x=Math.round(hitPoint.x-.5)+.5,z=Math.round(hitPoint.z-.5)+.5;ghost.position.set(x,level+.5,z);orient(ghost,selectedPiece,rotation);ghost.visible=mode==='place'&&Math.abs(x)<20&&Math.abs(z)<20}else ghost.visible=false}function makeGhost(){if(ghost)scene.remove(ghost);ghost=makePieceGroup(selectedPiece,selectedMaterial,true);scene.add(ghost);updateAim()}function addPiece(data){const type=['block','wall','roof','window','door'].includes(data.type)?data.type:'block',material=['wood','brick','glass','concrete'].includes(data.material)?data.material:'wood',obj=makePieceGroup(type,material);const d={x:data.x,y:data.y,z:data.z,rotation:data.rotation||0,level:data.level||0,type,material};obj.userData={...obj.userData,...d};obj.position.set(d.x,d.y,d.z);orient(obj,type,d.rotation);scene.add(obj);pieces.push(obj);return obj}function updateCount(){document.querySelector('#count').textContent=pieces.length}function toast(text){const e=document.querySelector('#toast');e.textContent=text;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1900)}
let audio;function playSound(remove=false){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio??=new A();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;o.type=remove?'triangle':'sine';o.frequency.setValueAtTime(remove?300:520,t);o.frequency.exponentialRampToValueAtTime(remove?170:760,t+.085);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.045,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(gain);gain.connect(audio.destination);o.start(t);o.stop(t+.13)}catch{}}
function actAtCenter(){updateAim();if(mode==='remove'){const hit=raycaster.intersectObjects(pieces,true)[0];if(!hit){toast('Aim at a piece and tap to delete');return}let root=hit.object;while(root.parent&&root.parent!==scene)root=root.parent;const i=pieces.indexOf(root);if(i<0)return;scene.remove(root);pieces.splice(i,1);updateCount();playSound(true);toast('Piece deleted');return}if(!ghost?.visible){toast('Aim at the central build plot');return}if(pieces.length>=MAX_PIECES){toast('Piece limit reached');return}addPiece({type:selectedPiece,material:selectedMaterial,x:ghost.position.x,y:level+.5,z:ghost.position.z,rotation,level});updateCount();playSound();toast('Piece placed')}
// OrbitControls handles one-finger orbit and two-finger pinch; this tracker only recognizes taps.
const activePointers=new Map();let multiTouch=false;renderer.domElement.addEventListener('pointerdown',e=>{activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,moved:false});if(activePointers.size>1)multiTouch=true},{passive:true});renderer.domElement.addEventListener('pointermove',e=>{const p=activePointers.get(e.pointerId);if(p&&Math.hypot(e.clientX-p.x,e.clientY-p.y)>9)p.moved=true},{passive:true});renderer.domElement.addEventListener('pointerup',e=>{const p=activePointers.get(e.pointerId);if(p&&activePointers.size===1&&!multiTouch&&!p.moved)actAtCenter();activePointers.delete(e.pointerId);if(!activePointers.size)multiTouch=false},{passive:true});const cancelPointer=e=>{activePointers.delete(e.pointerId);if(!activePointers.size)multiTouch=false};renderer.domElement.addEventListener('pointercancel',cancelPointer,{passive:true});renderer.domElement.addEventListener('lostpointercapture',cancelPointer,{passive:true});
function setMode(next){mode=next;for(const id of ['place','remove']){const active=id===(next==='place'?'place':'remove');document.querySelector(`#${id}`).classList.toggle('mode-active',active);document.querySelector(`#${id}`).classList.toggle('primary',active)}updateAim()}document.querySelector('#place').onclick=()=>setMode('place');document.querySelector('#remove').onclick=()=>setMode('remove');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{selectedPiece=b.dataset.piece;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b));makeGhost()});document.querySelectorAll('.material').forEach(b=>b.onclick=()=>{selectedMaterial=b.dataset.material;document.querySelectorAll('.material').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#selected').textContent=selectedMaterial[0].toUpperCase()+selectedMaterial.slice(1);makeGhost()});document.querySelector('#rotate').onclick=()=>{rotation=(rotation+1)%4;document.querySelector('#rotation').textContent=`${rotation*90}°`;updateAim()};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')document.querySelector('#rotate').click();if(e.key.toLowerCase()==='x')setMode('remove');if(e.key==='Escape')setMode('place')});document.querySelector('#level-up').onclick=()=>{level=Math.min(12,level+1);updateAim()};document.querySelector('#level-down').onclick=()=>{level=Math.max(0,level-1);updateAim()};document.querySelector('#grid-toggle').onclick=e=>{gridVisible=!gridVisible;grid.visible=gridVisible;e.currentTarget.textContent=gridVisible?'▦ Grid on':'▦ Grid off'};document.querySelector('#home').onclick=()=>{camera.position.set(26,23,31);controls.target.set(0,0,0);controls.update()};
function saveHouse(){try{const data=pieces.map(p=>({x:p.position.x,y:p.position.y,z:p.position.z,rotation:p.userData.rotation||0,type:p.userData.type,material:p.userData.material,level:p.userData.level||0}));localStorage.setItem(STORAGE_KEY,JSON.stringify(data));document.querySelector('#save-status').textContent=`Saved · ${data.length} pieces`;toast('House saved locally')}catch(error){console.error(error);document.querySelector('#save-status').textContent='Save failed';toast('Could not save: local storage unavailable')}}function parseSaved(raw){const parsed=JSON.parse(raw),list=Array.isArray(parsed)?parsed:parsed?.pieces;if(!Array.isArray(list)||list.length>MAX_PIECES)throw Error('Invalid saved project');return list.map(p=>{if(!p||!Number.isFinite(p.x)||!Number.isFinite(p.y)||!Number.isFinite(p.z))throw Error('Invalid coordinates');return{x:p.x,y:p.y,z:p.z,rotation:Number.isFinite(p.rotation)?p.rotation:0,level:Number.isFinite(p.level)?p.level:0,type:['block','wall','roof','window','door'].includes(p.type)?p.type:'block',material:['wood','brick','glass','concrete'].includes(p.material)?p.material:'wood'}})}function loadHouse(silent=false){let saved;try{const raw=localStorage.getItem(STORAGE_KEY);if(raw===null){document.querySelector('#save-status').textContent='No saved house';if(!silent)toast('No saved house found');return false}saved=parseSaved(raw)}catch(error){console.warn('Saved house could not be read; keeping current scene.',error);document.querySelector('#save-status').textContent='Invalid save';if(!silent)toast('Saved data is invalid; current build kept');return false}for(const p of pieces)scene.remove(p);pieces.length=0;try{saved.forEach(addPiece);updateCount();document.querySelector('#save-status').textContent=`Loaded · ${pieces.length} pieces`;updateAim();if(!silent)toast('Saved house loaded');return true}catch(error){console.error(error);for(const p of pieces)scene.remove(p);pieces.length=0;updateCount();document.querySelector('#save-status').textContent='Load failed';toast('Could not rebuild saved house');return false}}document.querySelectorAll('#save,#save-top,#save-panel').forEach(b=>b.addEventListener('click',saveHouse));document.querySelectorAll('#load,#load-top,#load-panel').forEach(b=>b.addEventListener('click',()=>loadHouse()));document.querySelector('#clear').onclick=()=>{pieces.forEach(p=>scene.remove(p));pieces.length=0;updateCount();toast('Build cleared')};
// Stable, elapsed-time animation; only lightweight actor transforms update each frame.
const clock=new THREE.Clock(),CAR_RADIUS=ROAD-1.05,LOOP=8*CAR_RADIUS;function pointOnLoop(distance,r){let d=((distance%(8*r))+8*r)%(8*r);if(d<2*r)return{x:-r+d,z:-r,yaw:Math.PI/2};if(d<4*r)return{x:r,z:-r+d-2*r,yaw:0};if(d<6*r)return{x:r-(d-4*r),z:r,yaw:-Math.PI/2};return{x:-r,z:r-(d-6*r),yaw:Math.PI}}function updateActors(t){cars.forEach((car,i)=>{const p=pointOnLoop(t*2.7+i*LOOP/cars.length,CAR_RADIUS);car.position.set(p.x,.08,p.z);car.rotation.y=p.yaw});walkers.forEach(({group,legs,index})=>{const perimeter=8*SIDE,d=(t*.56+index*perimeter/walkers.length)%perimeter,p=pointOnLoop(d,SIDE);group.position.set(p.x,.1,p.z);group.rotation.y=p.yaw;const swing=Math.sin(t*5+index)*.45;legs[0].rotation.x=swing;legs[1].rotation.x=-swing;group.position.y=.1+Math.abs(Math.sin(t*5+index))*.035})}
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);updateAim()}window.addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();updateActors(clock.getElapsedTime());updateAim();renderer.render(scene,camera)}animate();
