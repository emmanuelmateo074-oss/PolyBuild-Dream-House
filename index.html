<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a20"><title>PolyBuild — Dream House Studio</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script>
<style>
:root{color-scheme:dark;--lime:#c8f169;--panel:#142023ed;--line:#e2efe722}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:#142023;color:#edf2ed}button{font:inherit;color:inherit;cursor:pointer}#scene{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.topbar{position:absolute;z-index:2;top:0;left:0;right:0;height:68px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#0b1415c9,transparent);pointer-events:none}.brand,.top-actions{pointer-events:auto}.brand{font-weight:800;letter-spacing:.13em}.brand small{display:block;color:#9eada6;font-size:9px;font-weight:500;letter-spacing:.15em}.top-actions{display:flex;gap:8px}.panel{position:absolute;z-index:2;top:78px;width:220px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(16px)}.left{left:16px}.right{right:16px;width:184px}.eyebrow{font-size:9px;letter-spacing:.14em;color:#9eada6;text-transform:uppercase}.title{font-weight:700;margin:5px 0}.copy{font-size:10px;color:#9eada6;line-height:1.5}.section{border-top:1px solid var(--line);padding-top:11px;margin-top:12px}.section-title{font-size:11px;font-weight:700;margin-bottom:8px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tool,.material,.btn{border:1px solid var(--line);border-radius:8px;background:#1a2829;padding:8px}.tool{font-size:10px}.tool.active,.material.active{border-color:var(--lime);background:#c8f16918;color:var(--lime)}.tool b{display:block;font-size:16px}.materials{display:grid;gap:5px}.material{width:100%;display:flex;align-items:center;gap:8px;text-align:left;font-size:10px}.swatch{width:27px;height:27px;flex:none;border-radius:6px;border:1px solid #fff3}.wood{background:repeating-linear-gradient(5deg,#986840 0 4px,#c29360 5px 8px,#805336 9px 11px)}.brick{background:repeating-linear-gradient(0deg,transparent 0 9px,#60392f 10px 11px),repeating-linear-gradient(90deg,#bd684d 0 19px,#704337 20px 22px,#a6533d 23px 42px)}.glass{background:linear-gradient(130deg,#d9fff3b8,#5db5b29c 55%,#a7ded9)}.material small{display:block;color:#9eada6;font-size:9px;margin-top:2px}.rotate{display:flex;justify-content:space-between;align-items:center;font-size:10px}.rotate button,.quick button,.top-actions button,.action{border:1px solid var(--line);border-radius:8px;background:#1a2829;padding:7px 9px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:5px}.quick button{font-size:9px}.stat{display:flex;justify-content:space-between;font-size:10px;margin-top:9px;color:#b1beb8}.stat b{color:#fff}.crosshair{position:absolute;z-index:1;left:50%;top:50%;width:32px;height:32px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 1px 3px #000)}.crosshair:before,.crosshair:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#f3ffe9}.crosshair:before{width:1px;height:32px}.crosshair:after{height:1px;width:32px}.crosshair i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:var(--lime);border:1px solid #fff}.bottom{position:absolute;z-index:3;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.action{font-size:10px;white-space:nowrap}.action.primary{background:var(--lime);color:#18211c;font-weight:700}.toast{position:absolute;z-index:4;top:75px;left:50%;transform:translate(-50%,-8px);padding:9px 13px;border-radius:8px;background:#172622f2;border:1px solid var(--line);font-size:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.topbar{height:58px;padding:0 10px}.panel{top:auto;bottom:65px;padding:9px;width:165px;max-height:62%;overflow:auto}.left{left:7px}.right{right:7px;width:138px}.title{font-size:14px}.copy{font-size:9px}.section{margin-top:8px;padding-top:8px}.bottom{bottom:7px;gap:3px}.action{padding:9px 10px;font-size:9px}.top-actions button{font-size:9px;padding:7px}.brand{font-size:12px}.material{padding:5px}.swatch{width:23px;height:23px}}@media(max-width:390px){.panel{width:148px}.right{width:125px}.action{padding:9px 7px}.copy{display:none}}
</style>
</head>
<body><div id="app"><div id="scene"></div>
<header class="topbar"><div class="brand">⌂ POLYBUILD<small>DREAM HOUSE STUDIO</small></div><div class="top-actions"><button id="save-top">↧ Save</button><button id="load-top">↥ Load</button></div></header>
<aside class="panel left"><div class="eyebrow">Your workshop</div><div class="title">Build something.</div><div class="copy">Select a piece and finish. The center crosshair shows where it will be placed.</div><div class="section"><div class="section-title">Piece</div><div class="tools"><button class="tool active" data-piece="block"><b>▰</b>Block</button><button class="tool" data-piece="wall"><b>▤</b>Wall</button><button class="tool" data-piece="roof"><b>⌂</b>Roof</button></div></div><div class="section"><div class="section-title">Material</div><div class="materials"><button class="material active" data-material="wood"><i class="swatch wood"></i><span>Wood texture<small>Warm oak grain</small></span></button><button class="material" data-material="brick"><i class="swatch brick"></i><span>Brick texture<small>Classic red brick</small></span></button><button class="material" data-material="glass"><i class="swatch glass"></i><span>Glass transparency<small>Clear · 48% opacity</small></span></button></div></div><div class="section rotate"><span>Rotation</span><span><button id="rotate">↻</button> <b id="rotation">0°</b></span></div></aside>
<aside class="panel right"><div class="eyebrow">Project overview</div><div class="title">Your build</div><div class="stat"><span>Pieces placed</span><b id="count">0</b></div><div class="stat"><span>Current material</span><b id="selected">Wood</b></div><div class="section"><div class="section-title">Scene</div><div class="quick"><button id="home">⌂ Home view</button><button id="level-up">＋ Next level</button><button id="level-down">－ Lower level</button><button id="grid-toggle">▦ Grid on</button></div></div></aside>
<div class="crosshair" aria-hidden="true"><i></i></div><nav class="bottom"><button class="action primary" id="save">↧ Save</button><button class="action" id="load">↥ Load</button><button class="action" id="clear">⌧ Clear</button></nav><div class="toast" id="toast"></div></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const KEY='polybuild-dream-house',host=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#a9c5b7');scene.fog=new THREE.Fog('#a9c5b7',34,90);
const camera=new THREE.PerspectiveCamera(42,1,.1,180);camera.position.set(12,11,15);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=5;controls.maxDistance=42;
scene.add(new THREE.HemisphereLight('#e9fff0','#4b5a48',2));const sun=new THREE.DirectionalLight('#fff1d9',3);sun.position.set(-9,17,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#718a79',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.055;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(40,40,'#d7e8d055','#d7e8d033');grid.position.y=-.045;scene.add(grid);
function texture(type){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');if(type==='wood'){x.fillStyle='#a87548';x.fillRect(0,0,256,256);for(let i=0;i<36;i++){const y=Math.random()*256;x.strokeStyle=i%3?'#43251128':'#eec18933';x.lineWidth=Math.random()*3+1;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(80,y-8,160,y+9,256,y);x.stroke()}}else if(type==='brick'){x.fillStyle='#a9543f';x.fillRect(0,0,256,256);for(let r=0;r<8;r++){const y=r*32;x.fillStyle='#39272088';x.fillRect(0,y,256,3);for(let col=-1;col<5;col++){const xx=col*64+(r%2?32:0);x.fillRect(xx,y,3,32);x.fillStyle=['#b96349','#974b3a','#bc684e'][Math.floor(Math.random()*3)];x.fillRect(xx+4,y+4,56,24)}}}else{x.fillStyle='#85c8c0';x.fillRect(0,0,256,256);const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,'#effff899');g.addColorStop(.5,'#82cdca22');g.addColorStop(1,'#377f893d');x.fillStyle=g;x.fillRect(0,0,256,256)}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const textures={wood:texture('wood'),brick:texture('brick'),glass:texture('glass')},settings={wood:['#a87548',.72,1],brick:['#a9543f',.9,1],glass:['#91d6ce',.16,.48]};function makeMaterial(type,ghost=false){const s=settings[type]||settings.wood;return new THREE.MeshStandardMaterial({color:s[0],map:textures[type]||textures.wood,roughness:s[1],transparent:ghost||type==='glass',opacity:ghost?.4:s[2],depthWrite:!ghost&&type!=='glass',side:THREE.DoubleSide})}function geometry(type){return type==='wall'?new THREE.BoxGeometry(2,1,.16):type==='roof'?new THREE.BoxGeometry(2,.14,1.22):new THREE.BoxGeometry(1,1,1)}
let selectedPiece='block',selectedMaterial='wood',rotation=0,level=0,gridOn=true,ghost;const pieces=[],raycaster=new THREE.Raycaster(),center=new THREE.Vector2(0,0),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),point=new THREE.Vector3();
function makeGhost(){if(ghost)scene.remove(ghost);ghost=new THREE.Mesh(geometry(selectedPiece),makeMaterial(selectedMaterial,true));ghost.renderOrder=2;scene.add(ghost);aim()}
function aim(){raycaster.setFromCamera(center,camera);if(raycaster.ray.intersectPlane(plane,point)){const x=Math.round(point.x-.5)+.5,z=Math.round(point.z-.5)+.5;ghost.position.set(x,level+.5,z);ghost.rotation.set(0,rotation,0);if(selectedPiece==='roof')ghost.rotation.z=rotation%2===0?.52:-.52;ghost.visible=Math.abs(x)<18&&Math.abs(z)<18}else ghost.visible=false}
function addPiece(data){const type=['block','wall','roof'].includes(data.type)?data.type:'block',material=['wood','brick','glass'].includes(data.material)?data.material:'wood';const obj=new THREE.Mesh(geometry(type),makeMaterial(material));obj.castShadow=obj.receiveShadow=true;obj.userData={type,material,x:Number(data.x)||0,y:Number(data.y)||.5,z:Number(data.z)||0,rotation:Number(data.rotation)||0,level:Number(data.level)||0};obj.position.set(obj.userData.x,obj.userData.y,obj.userData.z);obj.rotation.set(0,obj.userData.rotation,0);if(type==='roof')obj.rotation.z=obj.userData.rotation%2===0?.52:-.52;scene.add(obj);pieces.push(obj)}
function updateCount(){document.querySelector('#count').textContent=pieces.length}function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1900)}
makeGhost();renderer.domElement.addEventListener('click',()=>{aim();if(!ghost.visible){toast('Aim at the build grid');return}const x=ghost.position.x,z=ghost.position.z;addPiece({type:selectedPiece,material:selectedMaterial,x,y:level+.5,z,rotation,level});updateCount()});
document.querySelectorAll('.tool').forEach(button=>button.onclick=()=>{selectedPiece=button.dataset.piece;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b===button));makeGhost()});document.querySelectorAll('.material').forEach(button=>button.onclick=()=>{selectedMaterial=button.dataset.material;document.querySelectorAll('.material').forEach(b=>b.classList.toggle('active',b===button));document.querySelector('#selected').textContent=selectedMaterial[0].toUpperCase()+selectedMaterial.slice(1);makeGhost()});document.querySelector('#rotate').onclick=()=>{rotation=(rotation+1)%4;document.querySelector('#rotation').textContent=`${rotation*90}°`;aim()};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')document.querySelector('#rotate').click()});
document.querySelector('#level-up').onclick=()=>{level=Math.min(12,level+1);aim()};document.querySelector('#level-down').onclick=()=>{level=Math.max(0,level-1);aim()};document.querySelector('#grid-toggle').onclick=e=>{gridOn=!gridOn;grid.visible=gridOn;e.currentTarget.textContent=gridOn?'▦ Grid on':'▦ Grid off'};document.querySelector('#home').onclick=()=>{camera.position.set(12,11,15);controls.target.set(0,1,0);controls.update()};
function saveHouse(){try{const data={version:1,savedAt:new Date().toISOString(),pieces:pieces.map(p=>({x:p.position.x,y:p.position.y,z:p.position.z,type:p.userData.type,material:p.userData.material,rotation:p.userData.rotation,level:p.userData.level}))};localStorage.setItem(KEY,JSON.stringify(data));toast(`Saved ${pieces.length} ${pieces.length===1?'piece':'pieces'}`)}catch(error){console.error(error);toast('Save failed: browser storage unavailable')}}
function loadHouse(){try{const raw=localStorage.getItem(KEY);if(!raw){toast('No saved house found');return}const data=JSON.parse(raw);if(!data||!Array.isArray(data.pieces)||data.pieces.length>10000||!data.pieces.every(p=>p&&Number.isFinite(Number(p.x))&&Number.isFinite(Number(p.y))&&Number.isFinite(Number(p.z))&&['block','wall','roof'].includes(p.type)&&['wood','brick','glass'].includes(p.material))){throw new Error('Invalid saved house')}pieces.forEach(p=>scene.remove(p));pieces.length=0;data.pieces.forEach(addPiece);updateCount();aim();toast(`Loaded ${pieces.length} ${pieces.length===1?'piece':'pieces'}`)}catch(error){console.error(error);toast('Could not load saved house')}}
document.querySelectorAll('#save,#save-top').forEach(button=>button.onclick=saveHouse);document.querySelectorAll('#load,#load-top').forEach(button=>button.onclick=loadHouse);document.querySelector('#clear').onclick=()=>{pieces.forEach(p=>scene.remove(p));pieces.length=0;updateCount();toast('Build cleared')};
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);aim()}window.addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();aim();renderer.render(scene,camera)}animate();
</script></body></html>
