document.querySelector('#level-up').onclick=()=>{level=Math.min(12,level+1);aim()};document.querySelector('#level-down').onclick=()=>{level=Math.max(0,level-1);aim()};document.querySelector('#grid-toggle').onclick=e=>{gridOn=!gridOn;grid.visible=gridOn;e.currentTarget.textContent=gridOn?'▦ Grid on':'▦ Grid off'};document.querySelector('#home').onclick=()=>{camera.position.set(12,11,15);controls.target.set(0,1,0);controls.update()};
function saveHouse(){try{const data={version:2,savedAt:new Date().toISOString(),pieces:pieces.map(p=>({x:p.position.x,y:p.position.y,z:p.position.z,type:p.userData.type,material:p.userData.material,rotation:p.userData.rotation,level:p.userData.level}))};localStorage.setItem(KEY,JSON.stringify(data));toast(`Saved ${pieces.length} ${pieces.length===1?'piece':'pieces'}`)}catch(error){console.error(error);toast('Save failed: browser storage unavailable')}}function loadHouse(){try{const raw=localStorage.getItem(KEY);if(!raw){toast('No saved house found');return}const data=JSON.parse(raw);if(!data||!Array.isArray(data.pieces)||data.pieces.length>10000||!data.pieces.every(p=>p&&Number.isFinite(Number(p.x))&&Number.isFinite(Number(p.y))&&Number.isFinite(Number(p.z))))throw new Error('Invalid saved house');const restored=data.pieces.map(p=>({...p,type:['block','wall','roof','window','door'].includes(p.type)?p.type:'block',material:['wood','brick','glass','concrete'].includes(p.material)?p.material:'wood'}));pieces.forEach(p=>scene.remove(p));pieces.length=0;restored.forEach(addPiece);updateCount();aim();toast(`Loaded ${pieces.length} ${pieces.length===1?'piece':'pieces'}`)}catch(error){console.error(error);toast('Could not load saved house')}}document.querySelectorAll('#save,#save-top').forEach(button=>button.onclick=saveHouse);document.querySelectorAll('#load,#load-top').forEach(button=>button.onclick=loadHouse);document.querySelector('#clear').onclick=()=>{pieces.forEach(p=>scene.remove(p));pieces.length=0;updateCount();toast('Build cleared')};
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);aim()}window.addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();aim();renderer.render(scene,camera)}animate();
</script></body></html>
